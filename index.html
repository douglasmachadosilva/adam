<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Clube do Adam</title>
  <meta name="description" content="Histórias, jogos, quizzes e outras invenções.">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap');

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f4f0e8;
      color: #18352a;
      font-family: "DM Sans", sans-serif;
    }

    .pagina {
      width: min(920px, calc(100% - 40px));
      margin: 0 auto;
      padding: 70px 0 40px;
    }

    header {
      margin-bottom: 55px;
    }

    .marca {
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #6f7e72;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      font-family: "DM Serif Display", serif;
      font-size: clamp(3rem, 8vw, 5.2rem);
      line-height: 0.95;
      font-weight: 400;
      letter-spacing: -0.03em;
    }

    .subtitulo {
      margin: 18px 0 0;
      max-width: 500px;
      color: #647068;
      font-size: 1.05rem;
      line-height: 1.6;
    }

    .sapinho {
      position: relative;
      display: flex;
      align-items: center;
      min-height: 310px;
      overflow: hidden;

      padding: 45px;

      background: #dce8d5;
      border-radius: 30px;

      text-decoration: none;
      color: inherit;

      transition:
        transform 180ms ease,
        box-shadow 180ms ease;
    }

    .sapinho:hover {
      transform: translateY(-4px);
      box-shadow: 0 18px 50px rgba(24, 53, 42, 0.10);
    }

    .conteudo {
      position: relative;
      z-index: 2;
      max-width: 470px;
    }

    .categoria {
      margin-bottom: 12px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #55705c;
    }

    h2 {
      margin: 0 0 12px;
      font-family: "DM Serif Display", serif;
      font-size: clamp(2.3rem, 6vw, 3.6rem);
      font-weight: 400;
      line-height: 1;
    }

    .descricao {
      margin: 0;
      max-width: 390px;
      color: #52655a;
      line-height: 1.6;
    }

    .entrar {
      display: inline-block;
      margin-top: 28px;
      font-weight: 700;
      color: #18352a;
    }

    .sapo {
      position: absolute;
      right: 35px;
      bottom: -24px;

      font-size: clamp(8rem, 20vw, 12rem);
      line-height: 1;

      transform: rotate(-5deg);
      opacity: 0.95;
    }

    footer {
      margin-top: 60px;
      color: #8b918c;
      font-size: 0.8rem;
    }

    @media (max-width: 600px) {
      .pagina {
        padding-top: 45px;
      }

      header {
        margin-bottom: 38px;
      }

      .sapinho {
        min-height: 390px;
        padding: 32px;
        align-items: flex-start;
      }

      .conteudo {
        max-width: 100%;
      }

      .descricao {
        max-width: 85%;
      }

      .sapo {
        right: 15px;
        bottom: -20px;
        font-size: 9rem;
      }
    }
  </style>
</head>

<body>

  <div class="pagina">

    <header>
      <div class="marca">Bem-vindo ao</div>
      <h1>Clube do Adam</h1>

      <p class="subtitulo">
        Histórias, jogos, quizzes e outras coisas que a gente inventa.
      </p>
    </header>

    <main>

      <a class="sapinho" href="sapinho/">

        <div class="conteudo">
          <div class="categoria">Experiência</div>

          <h2>Sapinho</h2>

          <p class="descricao">
            Do girino ao sapinho: acompanhe de perto uma metamorfose de verdade.
          </p>

          <span class="entrar">Explorar →</span>
        </div>

        <div class="sapo">🐸</div>

      </a>

    </main>

    <footer>
      Clube do Adam · 2026
    </footer>

  </div>

</body>
</html>
